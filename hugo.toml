baseURL = "https://www.mykorea.ru/"
title = "Моя Корея"
theme = "my-theme"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = true
enableInlineShortcodes = true
timeZone = "Asia/Seoul"
summaryLength = 70

[pagination]
  pagerSize = 10
  path = "page"

[taxonomies]
  category = "categories"
  tag = "tags"

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", "date", "publishDate"]
  publishDate = ["publishDate", "date"]
  expiryDate = ["expiryDate"]

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"

[imaging]
  quality = 88
  resampleFilter = "Lanczos"
  anchor = "Smart"

[related]
  includeNewer = true
  threshold = 55
  toLower = true

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "tags"
    weight = 80

  [[related.indices]]
    name = "date"
    weight = 10

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[services]
  [services.rss]
    limit = 50

[sitemap]
  changeFreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[minify]
  minifyOutput = true

[params]
  author = "Владимир"
  organizationName = "Моя Корея"
  alternateName = "MyKorea"
  description = "Личное медиа о жизни в Южной Корее: переезд, работа, учёба, путешествия, корейский язык и практический опыт."
  seoTitle = "Моя Корея — жизнь, работа и путешествия в Южной Корее"
  titleSeparator = " — "
  logo = "images/logo.webp"
  defaultImage = "images/logo.webp"
  favicon = "favicon-32x32.png"
  appleTouchIcon = "apple-touch-icon.png"
  themeColor = "#ffffff"
  dateFormat = "02.01.2006"

  showPinStrip = true
  pinCategory = "Pin"
  pinLimit = 10
  pinTitleLength = 62
  hiddenCategories = ["Pin"]
  homePageSize = 10

  [params.search]
    googleCSEID = "30b95c9519edb466e"

[languages]
  [languages.ru]
    label = "Русский"
    locale = "ru-RU"
    contentDir = "content/ru"
    weight = 1
    title = "Моя Корея"

    [languages.ru.params]
      description = "Личное медиа о жизни в Южной Корее: переезд, работа, учёба, путешествия, корейский язык и практический опыт."
      seoTitle = "Моя Корея — жизнь, работа и путешествия в Южной Корее"
      flag = "images/flags/4x3/ru.svg"

  [languages.ko]
    label = "한국어"
    locale = "ko-KR"
    contentDir = "content/ko"
    weight = 2
    title = "마이코리아"

    [languages.ko.params]
      description = "한국 생활, 이주, 취업, 유학, 여행과 한국어에 관한 실용적인 미디어."
      seoTitle = "마이코리아 — 한국 생활, 일과 여행"
      flag = "images/flags/4x3/kr.svg"

  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 3
    title = "My Korea"

    [languages.en.params]
      description = "A practical media site about life in South Korea, relocation, work, study, travel and the Korean language."
      seoTitle = "My Korea — life, work and travel in South Korea"
      flag = "images/flags/4x3/us.svg"
