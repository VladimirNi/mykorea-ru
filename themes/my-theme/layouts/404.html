{{ define "main" }}
  <div class="content-shell error-page">
    <span class="error-code">404</span>
    <h1>{{ i18n "page_not_found" | default "Страница не найдена" }}</h1>
    <p>{{ i18n "page_not_found_text" | default "Возможно, адрес изменился или публикация была перемещена." }}</p>
    <a class="primary-button" href="{{ .Site.Home.RelPermalink }}">{{ i18n "go_home" | default "Вернуться на главную" }}</a>
  </div>
{{ end }}
