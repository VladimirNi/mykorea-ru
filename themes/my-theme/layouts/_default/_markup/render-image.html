{{- $src := .Destination -}}
{{- $alt := .Text | default .Page.Title -}}
{{- $title := .Title -}}
{{- $path := strings.TrimPrefix "/" $src -}}
{{- $resource := .Page.Resources.GetMatch $path -}}
{{- if not $resource }}{{ $resource = resources.Get $path }}{{ end -}}

<figure class="content-image">
  {{- if and $resource (ne $resource.MediaType.SubType "svg") -}}
    {{- $targetWidth := $resource.Width -}}
    {{- if gt $targetWidth 1400 }}{{ $targetWidth = 1400 }}{{ end -}}
    {{- $processed := $resource.Resize (printf "%dx webp q86" $targetWidth) -}}
    <img
      src="{{ $processed.RelPermalink }}"
      width="{{ $processed.Width }}"
      height="{{ $processed.Height }}"
      alt="{{ $alt }}"
      loading="lazy"
      decoding="async"
      {{ with $title }}title="{{ . }}"{{ end }}
    >
  {{- else if $resource -}}
    <img src="{{ $resource.RelPermalink }}" alt="{{ $alt }}" loading="lazy" decoding="async" {{ with $title }}title="{{ . }}"{{ end }}>
  {{- else -}}
    {{- $finalSrc := $src -}}
    {{- if not (or (strings.HasPrefix $src "https://") (strings.HasPrefix $src "http://")) -}}
      {{- $finalSrc = $src | relURL -}}
    {{- end -}}
    <img src="{{ $finalSrc | safeURL }}" alt="{{ $alt }}" loading="lazy" decoding="async" {{ with $title }}title="{{ . }}"{{ end }}>
  {{- end -}}
  {{- with $title -}}<figcaption>{{ . }}</figcaption>{{- end -}}
</figure>
