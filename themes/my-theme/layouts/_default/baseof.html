<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}page-home{{ else if .IsPage }}page-single{{ else }}page-list{{ end }}">
    <a class="skip-link" href="#main-content">{{ i18n "skip_to_content" | default "Перейти к содержанию" }}</a>

    {{ partial "header.html" . }}
    {{ partial "pin-strip.html" . }}

    <main id="main-content" class="site-main">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
    {{ partial "bottom-nav.html" . }}
    {{ partialCached "head/js.html" . }}
  </body>
</html>
