<footer class="site-footer">
  <div class="content-shell footer-inner">
    <a class="footer-brand" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    {{- with .Site.Params.description -}}<p>{{ . }}</p>{{- end -}}
    <small>© {{ now.Year }} {{ .Site.Params.organizationName | default .Site.Title }}. {{ i18n "all_rights_reserved" | default "Все права защищены." }}</small>
  </div>
</footer>
