<header class="site-header" data-site-header>
  <div class="header-inner">
    <a class="site-logo" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Title }} — {{ i18n "home" | default "Главная" }}">
      <img
        src="{{ (.Site.Params.logo | default "images/logo.webp") | relURL }}"
        alt="{{ .Site.Title }}"
        width="118"
        height="50"
      >
    </a>

    {{ partial "language-switcher.html" . }}
  </div>
</header>
